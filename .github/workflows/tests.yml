name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  phpunit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 8.1 = minimum the code supports; 8.4 = what current Unraid ships.
        php: ['8.1', '8.4']
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: posix, curl
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      # Runs the unit and integration suites (phpunit.xml). The integration
      # suite uses real rsync/ssh binaries against temp dirs - both are
      # preinstalled on ubuntu-latest. The e2e suite needs a live Unraid
      # server and is deliberately excluded (tests/e2e/phpunit.e2e.xml).
      - name: Run unit + integration tests
        run: composer test
